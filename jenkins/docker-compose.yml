name: jenkins

services:
  jenkins:
    build: .
    container_name: jenkins
    network_mode: host
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.TcpSlaveAgentListener.port=0
      - JENKINS_OPTS=--httpPort=8888
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins-home:
