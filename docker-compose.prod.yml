name: mfs-prod

services:
  mysql:
    image: mysql:8.0
    container_name: mfs-prod-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_change_me}
      MYSQL_DATABASE: student_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./db/students_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    container_name: mfs-prod-api
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_change_me}
      DB_NAME: student_db
    ports:
      - "5002:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: mfs-prod-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-prod-data:
